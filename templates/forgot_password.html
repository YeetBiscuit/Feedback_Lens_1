<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Forgot password</title><style>body{font-family:system-ui;background:#f4f7fb}.card{max-width:440px;margin:8vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 35px #0002}label{display:block;font-weight:700;margin-top:14px}input{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #ccd3df;border-radius:8px}button{width:100%;padding:11px;margin-top:18px;border:0;border-radius:8px;background:#2457d6;color:#fff;font-weight:700}.message{background:#eaf2ff;padding:12px;border-radius:8px}</style></head><body><div class="card"><h1>Reset password</h1><p>Enter your institutional email address.</p>{% if message %}<div class="message">{{ message }}</div>{% endif %}<form method="post"><label>Institutional email</label><input name="email" type="email" required><button>Send reset email</button></form><p><a href="/login">Back to login</a></p></div></body></html>
