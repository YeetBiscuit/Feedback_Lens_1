{% extends "account_base.html" %}
{% block title %}{{ title }} | FeedbackLens{% endblock %}
{% block content %}
<div class="card-header">
  <h1>{{ title }}</h1>
  <p>Use at least 12 characters.</p>
</div>
{% if error %}<div class="message error">{{ error }}</div>{% endif %}
<form method="post" action="{{ action_url }}">
  <div class="form-group">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="12" required>
  </div>
  <div class="form-group">
    <label for="password-confirmation">Confirm password</label>
    <input id="password-confirmation" name="password_confirmation" type="password" minlength="12" required>
  </div>
  <button class="btn-primary">Save password</button>
</form>
{% endblock %}
