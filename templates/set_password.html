<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ title }}</title><style>body{font-family:system-ui;background:#f4f7fb}.card{max-width:440px;margin:8vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 35px #0002}label{display:block;font-weight:700;margin-top:14px}input{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #ccd3df;border-radius:8px}button{width:100%;padding:11px;margin-top:18px;border:0;border-radius:8px;background:#2457d6;color:#fff;font-weight:700}.error{color:#b42318}</style></head><body><div class="card"><h1>{{ title }}</h1><p>Use at least 12 characters.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="{{ action_url }}"><label>New password</label><input name="password" type="password" minlength="12" required><label>Confirm password</label><input name="password_confirmation" type="password" minlength="12" required><button>Save password</button></form></div></body></html>
