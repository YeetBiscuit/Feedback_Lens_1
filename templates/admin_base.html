<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Feedback Lens Admin{% endblock %}</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0}
    header{height:64px;background:#172033;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
    header a{color:#fff;text-decoration:none}.brand{font-weight:800;font-size:1.1rem}
    main{max-width:1180px;margin:28px auto;padding:0 20px 60px}
    h1{margin:0 0 6px}.sub{color:#667085;margin:0 0 24px}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:18px 0}
    .card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 12px rgba(20,30,50,.04)}
    .card h2{margin:0 0 14px;font-size:1.1rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px;color:#344054}
    input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cfd6e1;border-radius:8px;background:#fff}
    button,.button{display:inline-block;border:0;border-radius:8px;padding:10px 14px;background:#2457d6;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
    button.secondary,.button.secondary{background:#e9eef8;color:#26344d}
    button.danger{background:#b42318}button:disabled{opacity:.45;cursor:not-allowed}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f5;font-size:.9rem}
    th{font-size:.78rem;text-transform:uppercase;color:#667085}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f7ee;color:#177245;font-size:.75rem;font-weight:700}
    .pill.warn{background:#fff2d8;color:#8a5700}.pill.bad{background:#fee4e2;color:#b42318}
    .message{padding:11px 13px;border-radius:8px;margin:10px 0;background:#eaf2ff;color:#1849a9}
    .message.error{background:#fee4e2;color:#b42318}.hidden{display:none}
    .row-actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#667085;font-size:.84rem}
    dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 30px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
    dialog::backdrop{background:rgba(20,30,50,.5)}.dialog-body{padding:22px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    @media(max-width:700px){header{padding:0 16px}main{margin-top:18px}table{display:block;overflow:auto}}
  </style>
</head>
<body>
<header>
  <a class="brand" href="/admin/units">Feedback Lens</a>
  <div>{{ user.display_name or user.email }} &nbsp; <a href="/logout">Log out</a></div>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
const CSRF_TOKEN = {{ csrf_token|tojson }};
async function api(url, options){
  options = options || {};
  options.headers = options.headers || {};
  if(options.method && options.method !== 'GET'){
    options.headers['X-CSRF-Token'] = CSRF_TOKEN;
  }
  if(options.body && !(options.body instanceof FormData) && !options.headers['Content-Type']){
    options.headers['Content-Type'] = 'application/json';
  }
  const response = await fetch(url, options);
  let data = {};
  try{ data = await response.json(); }catch(e){}
  if(!response.ok){
    const error = data.error || {};
    const ex = new Error(error.message || 'Request failed.');
    ex.code = error.code; ex.details = error.details || {};
    throw ex;
  }
  return data;
}
function escapeHtml(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function showMessage(target, text, isError){
  const box = document.getElementById(target);
  box.textContent = text; box.className = 'message' + (isError ? ' error' : '');
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
