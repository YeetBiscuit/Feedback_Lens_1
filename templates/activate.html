<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Activate Feedback Lens</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0}.card{max-width:460px;margin:8vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 35px #0002}label{display:block;font-weight:700;margin-top:14px}input{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #ccd3df;border-radius:8px}button{width:100%;padding:11px;margin-top:18px;border:0;border-radius:8px;background:#2457d6;color:#fff;font-weight:700}.message{background:#eaf2ff;padding:12px;border-radius:8px;margin-top:14px}</style></head><body><div class="card"><h1>Activate your account</h1>{% if entry_valid %}<p>Enter the institutional details shown in your Unit roster.</p><form id="form"><input type="hidden" id="entry" value="{{ entry_token }}"><label>Student ID</label><input id="student-id" required><label>Institutional email</label><input id="email" type="email" required><button>Send activation email</button></form><div id="message"></div>{% else %}<div class="message">This activation entry is no longer valid. Return to Moodle for the latest link.</div>{% endif %}</div>{% if entry_valid %}<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/account/activation/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entry_token:document.getElementById('entry').value,student_identifier:document.getElementById('student-id').value,email:document.getElementById('email').value})});const d=await r.json();document.getElementById('message').innerHTML='<div class="message">'+d.message+'</div>';};</script>{% endif %}</body></html>
